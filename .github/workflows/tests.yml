name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: v2-${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: v2-${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
        shell: bash
      
      - name: Install macfuse
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install --cask macfuse
        shell: bash

      # Create test-bot home directory to prevent RuboCop File.realpath errors
      # test-bot sets HOME=./home/ but RuboCop tries to resolve paths before it's created
      # See: https://github.com/rubocop/rubocop/issues/11725
      - name: Create test-bot home directory
        run: mkdir -p home/.cache
        shell: bash

      - name: Run brew test-bot
        run: brew test-bot
        env:
          XDG_CACHE_HOME: /tmp
          HOME: ${{ github.workspace }}/home
        shell: bash

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@main
        with:
          name: bottles_${{runner.os}}
          path: '*.bottle.*'
          if-no-files-found: 'error'
